<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LME VideoFlow Studio | Little Montessori Explorers</title>
<meta name="description" content="Skriv en idé, velg en stil, og få en ferdig video med AI-manus, AI-bilder, AI-stemme og undertekster brent inn.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'Sasson Montessori';
    src: url('/fonts/SassoonMontessori.woff2') format('woff2'), url('/fonts/SassoonMontessori.ttf') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root {
    --violet-50:#f5f0ff; --violet-100:#ece0ff; --violet-200:#dcc9ff; --violet-400:#9d78ff;
    --violet-500:#7c4dff; --violet-600:#6a3fe0; --violet-700:#5730b8;
    --ink:#1e1a24; --ink-soft:#5c5568; --warm-white:#fbfaff;
    --shadow-soft:0 8px 32px rgba(90,50,160,.10); --shadow-med:0 16px 48px rgba(90,50,160,.16);
    --font-head:'Playpen Sans', system-ui, sans-serif;
    --font-body:'Sasson Montessori', 'Playpen Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body); color: var(--ink); line-height: 1.6;
    background: radial-gradient(ellipse 70% 45% at 15% 0%, var(--violet-50), transparent 60%), var(--warm-white);
    min-height: 100vh;
  }
  h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.2; }
  button, input, select, textarea { font-family: var(--font-body) !important; }
  a { color: var(--violet-600); }

  .topbar { position: sticky; top: 0; z-index: 100; background: rgba(251,250,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--violet-100); padding: .75rem 1.5rem; }
  .topbar-inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .brand { font-family: var(--font-head); font-weight: 700; color: var(--violet-700); text-decoration: none; font-size: 1.1rem; }
  .top-actions { display: flex; align-items: center; gap: .7rem; }
  .balance-pill { background: var(--violet-100); color: var(--violet-700); font-weight: 700; font-size: .88rem; padding: .45rem 1rem; border-radius: 999px; }
  .lang-toggle { background: linear-gradient(135deg, var(--violet-400), var(--violet-600)); color: #fff; border: none; padding: .5rem 1.1rem; border-radius: 999px; font-weight: 600; font-size: .88rem; cursor: pointer; box-shadow: var(--shadow-soft); }

  .wrap { max-width: 1320px; margin: 1.5rem auto 5rem; padding: 0 1.5rem; }
  .head { margin-bottom: 1.25rem; }
  .head h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
  .head p { color: var(--ink-soft); max-width: 700px; margin-top: .4rem; }

  .card { background: #fff; border: 1px solid var(--violet-100); border-radius: 22px; box-shadow: var(--shadow-soft); padding: 1.4rem 1.5rem; margin-bottom: 1.25rem; }
  .card > h2 { font-size: 1.1rem; margin-bottom: .3rem; }
  .card > .sub { color: var(--ink-soft); font-size: .9rem; margin-bottom: 1rem; }

  label.field { display: block; margin-bottom: .95rem; }
  label.field > span { display: block; font-weight: 700; font-size: .9rem; margin-bottom: .35rem; }
  input[type=text], select, textarea { width: 100%; border: 1.5px solid var(--violet-200); border-radius: 14px; padding: .7rem .9rem; font-size: 1rem; color: var(--ink); background: #fff; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--violet-400); }
  textarea { resize: vertical; min-height: 84px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .9rem; }
  @media (max-width: 780px) { .three { grid-template-columns: 1fr; } }

  .btn { border: none; border-radius: 999px; padding: .8rem 1.5rem; font-weight: 700; font-size: 1rem; cursor: pointer; background: linear-gradient(135deg, var(--violet-500), var(--violet-600)); color: #fff; box-shadow: var(--shadow-soft); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--violet-600); border: 1.5px solid var(--violet-200); box-shadow: none; }
  .btn.small { padding: .5rem 1rem; font-size: .88rem; }
  .btn.gold { background: linear-gradient(135deg, #ffb238, #ff8f38); }
  .btn-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }

  .proj-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 1rem; }
  .proj-card { background: #fff; border: 1.5px solid var(--violet-100); border-radius: 18px; padding: 1rem; cursor: pointer; }
  .proj-card:hover { border-color: var(--violet-400); }
  .proj-card .thumb { aspect-ratio: 16/9; border-radius: 12px; background: var(--violet-50); display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; margin-bottom: .6rem; }
  .proj-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .empty { color: var(--ink-soft); padding: 1.2rem 0; text-align: center; }

  .scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 1rem; }
  .scene-card { background: #fff; border: 1.5px solid var(--violet-100); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-soft); }
  .scene-frame { aspect-ratio: 16/9; background: var(--violet-50); display: flex; align-items: center; justify-content: center; }
  .scene-frame img { width: 100%; height: 100%; object-fit: cover; }
  .scene-body { padding: .9rem 1rem 1.1rem; }
  .scene-body textarea { font-size: .85rem; margin-bottom: .4rem; }
  .scene-body label.mini { display: block; font-size: .72rem; font-weight: 700; color: var(--ink-soft); margin: .3rem 0 .15rem; }
  .scene-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }

  .modal-bg { position: fixed; inset: 0; background: rgba(30,26,36,.55); display: none; align-items: center; justify-content: center; z-index: 900; padding: 1rem; }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; border-radius: 22px; max-width: 560px; width: 100%; max-height: 86vh; overflow: auto; padding: 1.5rem; box-shadow: var(--shadow-med); }
  .cost-box { background: #fff6e5; border: 1.5px solid #ffe0ad; border-radius: 14px; padding: .8rem 1rem; margin: .8rem 0; }
  .cost-box b { color: #8a5a10; font-size: 1.15rem; }
  .modal pre { background: #f7f4ff; border-radius: 12px; padding: .8rem; font-size: .78rem; white-space: pre-wrap; max-height: 220px; overflow: auto; margin-top: .5rem; }

  .note { background: var(--violet-50); border: 1px solid var(--violet-100); border-radius: 14px; padding: .8rem 1rem; font-size: .9rem; color: var(--violet-700); margin-top: .8rem; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(30px); background: var(--ink); color: #fff; padding: .7rem 1.2rem; border-radius: 999px; font-weight: 600; font-size: .95rem; opacity: 0; pointer-events: none; transition: all .3s; z-index: 500; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="/videoflow" class="brand">🎞️ LME VideoFlow</a>
    <div class="top-actions">
      <span class="balance-pill" id="balancePill">…</span>
      <button class="lang-toggle" id="langToggle">EN 🌍</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <h1 data-no="Lag en video" data-en="Make a video">Lag en video</h1>
    <p data-no="Ingenting koster kreditter uten at du bekrefter det først." data-en="Nothing costs credits without your confirmation first.">Ingenting koster kreditter uten at du bekrefter det først.</p>
  </div>

  <div id="libraryView">
    <div class="card">
      <h2 data-no="💡 Ny idé" data-en="💡 New idea">💡 Ny idé</h2>
      <label class="field">
        <span data-no="Idé eller tema" data-en="Idea or topic">Idé eller tema</span>
        <textarea id="in-idea" placeholder="Why the deepest place on Earth is scarier than space"></textarea>
      </label>
      <div class="three">
        <label class="field">
          <span data-no="Stil" data-en="Style">Stil</span>
          <select id="in-style"></select>
        </label>
        <label class="field">
          <span data-no="Stemme" data-en="Voice">Stemme</span>
          <select id="in-voice"></select>
        </label>
        <label class="field">
          <span data-no="Språk" data-en="Language">Språk</span>
          <select id="in-lang">
            <option value="en" data-no="Engelsk" data-en="English">Engelsk</option>
            <option value="no" data-no="Norsk" data-en="Norwegian">Norsk</option>
          </select>
        </label>
      </div>
      <div class="btn-row">
        <button class="btn" id="createBtn" type="button">🪄 <span data-no="Lag manus" data-en="Generate script">Lag manus</span></button>
      </div>
    </div>

    <div class="card">
      <h2 data-no="📚 Dine videoer" data-en="📚 Your videos">📚 Dine videoer</h2>
      <div class="proj-list" id="projList"><div class="empty" data-no="Laster …" data-en="Loading …">Laster …</div></div>
    </div>
  </div>

  <div id="projectView" style="display:none;">
    <button class="btn ghost small" id="backBtn" type="button">← <span data-no="Tilbake" data-en="Back">Tilbake</span></button>
    <div class="card" style="margin-top:1rem;">
      <h2 id="pTitle">…</h2>
      <div class="btn-row">
        <button class="btn ghost small" id="saveEditsBtn" type="button">💾 <span data-no="Lagre endringer" data-en="Save changes">Lagre endringer</span></button>
        <button class="btn gold small" id="renderBtn" type="button">🎬 <span data-no="Lag ferdig video" data-en="Assemble finished video">Lag ferdig video</span></button>
      </div>
      <div id="renderResults"></div>
    </div>
    <div class="scene-grid" id="sceneGrid"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 data-no="Dette koster kreditter" data-en="This costs credits">Dette koster kreditter</h3>
    <p id="modalDesc" style="color:var(--ink-soft); font-size:.92rem;"></p>
    <div class="cost-box"><b id="modalCost"></b> <span id="modalCostNote" class="hint"></span></div>
    <pre id="modalPromptPreview" style="display:none;"></pre>
    <div class="btn-row" style="margin-top:1rem;">
      <button class="btn gold" id="modalConfirmBtn" type="button">✅ <span data-no="Ja, generer" data-en="Yes, generate">Ja, generer</span></button>
      <button class="btn ghost" id="modalCancelBtn" type="button" data-no="Avbryt" data-en="Cancel">Avbryt</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var currentLang = (window.LME_CURRENT_LANG === 'en') ? 'en' : 'no';
  function isEn() { return currentLang === 'en'; }
  function L(no, en) { return isEn() ? en : no; }
  function q(id) { return document.getElementById(id); }

  function switchLanguage(lang) {
    currentLang = lang; window.LME_CURRENT_LANG = lang; document.documentElement.lang = lang;
    document.querySelectorAll('[data-no][data-en]').forEach(function (el) {
      var t = el.getAttribute('data-' + lang); if (t === null) return;
      if (t.indexOf('<') !== -1) el.innerHTML = t; else el.textContent = t;
    });
    q('langToggle').textContent = lang === 'no' ? 'EN 🌍' : 'NO 🇳🇴';
    renderProjList();
  }
  q('langToggle').addEventListener('click', function () { switchLanguage(currentLang === 'no' ? 'en' : 'no'); });
  function toast(msg) { var t = q('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 2800); }

  var STYLES = [
    ['cinematic','Cinematic'], ['pixar3d','3D Pixar'], ['anime','Anime'], ['claymation','Claymation'],
    ['comic','Comic book'], ['vintage','Vintage'], ['photoreal','Photoreal'], ['whiteboard','Whiteboard'],
  ];
  var VOICES = [
    ['21m00Tcm4TlvDq8ikWAM','Rachel'], ['pNInz6obpgDQGcFmaJgB','Adam'], ['EXAVITQu4vr4xnSDxMaL','Bella'], ['ErXwobaYiN019PkySvjV','Antoni'],
  ];
  STYLES.forEach(function (s) { var o = document.createElement('option'); o.value = s[0]; o.textContent = s[1]; q('in-style').appendChild(o); });
  VOICES.forEach(function (v) { var o = document.createElement('option'); o.value = v[0]; o.textContent = v[1]; q('in-voice').appendChild(o); });

  function api(url, opts) {
    return fetch(url, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts || {}))
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); });
  }
  function post(url, body) { return api(url, { method: 'POST', body: JSON.stringify(body || {}) }); }

  function refreshBalance() {
    api('/api/videoflow/project?balance=1').then(function (res) {
      var d = res.data || {};
      if (!d.loggedIn) { q('balancePill').textContent = L('Logg inn', 'Log in'); return; }
      q('balancePill').textContent = d.owner ? L('Eier · ubegrenset', 'Owner · unlimited') : d.balance + ' ' + L('kreditter', 'credits');
    });
  }

  var pendingConfirm = null;
  function showConfirmModal(opts) {
    q('modalDesc').textContent = opts.desc || '';
    q('modalCost').textContent = opts.creditCost + ' ' + L('kreditter', 'credits');
    q('modalCostNote').textContent = opts.note || '';
    if (opts.promptPreview) { q('modalPromptPreview').style.display = ''; q('modalPromptPreview').textContent = opts.promptPreview; }
    else { q('modalPromptPreview').style.display = 'none'; }
    pendingConfirm = opts.onConfirm;
    q('modalBg').classList.add('show');
  }
  q('modalCancelBtn').addEventListener('click', function () { q('modalBg').classList.remove('show'); pendingConfirm = null; });
  q('modalConfirmBtn').addEventListener('click', function () {
    var fn = pendingConfirm; q('modalBg').classList.remove('show'); pendingConfirm = null;
    if (fn) fn();
  });

  function paidAction(url, body, desc, onDone) {
    post(url, Object.assign({}, body, { confirm: false })).then(function (res) {
      if (res.data && res.data.error) { toast(res.data.error); return; }
      if (!res.data || !res.data.paid) { toast(L('Uventet svar', 'Unexpected response')); return; }
      showConfirmModal({
        desc: desc, creditCost: res.data.creditCost, note: res.data.note,
        promptPreview: res.data.systemPrompt ? (res.data.systemPrompt + '\n\n---\n\n' + res.data.userPrompt) : (res.data.prompt || res.data.text),
        onConfirm: function () {
          toast(L('Genererer …', 'Generating …'));
          post(url, Object.assign({}, body, { confirm: true })).then(function (r2) {
            if (r2.data && r2.data.error) {
              toast(r2.data.error);
              if (r2.data.needCredits) refreshBalance();
              return;
            }
            refreshBalance();
            onDone(r2.data);
          }).catch(function () { toast(L('Nettverksfeil', 'Network error')); });
        },
      });
    }).catch(function () { toast(L('Nettverksfeil', 'Network error')); });
  }

  var projects = [];
  function renderProjList() {
    var box = q('projList');
    if (!projects.length) { box.innerHTML = '<div class="empty">' + L('Ingen videoer ennå.', 'No videos yet.') + '</div>'; return; }
    box.innerHTML = '';
    projects.forEach(function (p) {
      var card = document.createElement('div'); card.className = 'proj-card';
      card.innerHTML = '<div class="thumb">' + (p.thumbnailUrl ? '<img src="' + p.thumbnailUrl + '">' : '🎬') + '</div><h4></h4><div class="hint"></div>';
      card.querySelector('h4').textContent = p.title || '(uten tittel)';
      card.querySelector('.hint').textContent = p.style + ' · ' + p.sceneCount + ' scener · ' + p.status;
      card.addEventListener('click', function () { openProject(p.id); });
      box.appendChild(card);
    });
  }
  function refreshProjects() {
    api('/api/videoflow/project').then(function (res) {
      projects = (res.data && res.data.projects) || [];
      renderProjList();
    });
  }

  q('createBtn').addEventListener('click', function () {
    var idea = q('in-idea').value.trim();
    if (!idea) { toast(L('Skriv en idé først', 'Write an idea first')); return; }
    var body = { idea: idea, style: q('in-style').value, voiceId: q('in-voice').value, lang: q('in-lang').value };
    paidAction('/api/videoflow/script', body, L('Dette skriver et manus for hele videoen med Claude.', 'This writes the whole video script with Claude.'), function (data) {
      toast(L('🪄 Manus laget!', '🪄 Script ready!'));
      refreshProjects();
      openProjectDoc(data.project);
    });
  });

  var currentProject = null;
  function openProject(id) {
    api('/api/videoflow/project?id=' + encodeURIComponent(id)).then(function (res) {
      if (!res.data || !res.data.project) { toast(L('Fant ikke videoen', 'Video not found')); return; }
      openProjectDoc(res.data.project);
    });
  }
  function openProjectDoc(project) {
    currentProject = project;
    q('libraryView').style.display = 'none'; q('projectView').style.display = '';
    q('renderResults').innerHTML = '';
    renderProject();
    if (project.render && project.render.status === 'rendering') pollRender();
    else if (project.render) renderRenderState(project.render);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  q('backBtn').addEventListener('click', function () { q('projectView').style.display = 'none'; q('libraryView').style.display = ''; refreshProjects(); });

  function renderProject() {
    var p = currentProject;
    q('pTitle').textContent = p.title || p.input.idea.slice(0, 60) || L('Uten tittel', 'Untitled');
    var grid = q('sceneGrid'); grid.innerHTML = '';
    p.scenes.slice().sort(function (a, b) { return a.index - b.index; }).forEach(function (scene) { grid.appendChild(renderSceneCard(scene)); });
  }

  function renderSceneCard(scene) {
    var card = document.createElement('div'); card.className = 'scene-card';
    var frame = document.createElement('div'); frame.className = 'scene-frame';
    frame.innerHTML = scene.image && scene.image.assetUrl ? '<img src="' + scene.image.assetUrl + '">' : '🖼️';
    card.appendChild(frame);
    var body = document.createElement('div'); body.className = 'scene-body';
    body.innerHTML =
      '<div class="hint">' + L('Scene', 'Scene') + ' ' + (scene.index + 1) + '</div>' +
      '<label class="mini">' + L('Replikk (opplest)', 'Narration (spoken)') + '</label><textarea data-f="narration" rows="2"></textarea>' +
      '<label class="mini">' + L('Undertekst (kort)', 'Caption (short)') + '</label><input data-f="caption" type="text">' +
      '<label class="mini">' + L('Bildebeskrivelse', 'Visual description') + '</label><textarea data-f="visualDescription" rows="2"></textarea>' +
      (scene.voice && scene.voice.assetUrl ? '<audio controls src="' + scene.voice.assetUrl + '" style="width:100%;margin-top:.4rem;"></audio>' : '') +
      '<div class="scene-actions"></div>';
    body.querySelector('[data-f=narration]').value = scene.narration || '';
    body.querySelector('[data-f=caption]').value = scene.caption || '';
    body.querySelector('[data-f=visualDescription]').value = scene.visualDescription || '';
    body.querySelector('[data-f=narration]').addEventListener('change', function () { scene.narration = this.value; });
    body.querySelector('[data-f=caption]').addEventListener('change', function () { scene.caption = this.value; });
    body.querySelector('[data-f=visualDescription]').addEventListener('change', function () { scene.visualDescription = this.value; });

    var actions = body.querySelector('.scene-actions');
    var imgBtn = document.createElement('button'); imgBtn.className = 'btn small'; imgBtn.type = 'button';
    imgBtn.textContent = '🖼️ ' + (scene.image && scene.image.assetUrl ? L('Lag bilde på nytt', 'Regenerate image') : L('Lag bilde', 'Generate image'));
    imgBtn.addEventListener('click', function () {
      paidAction('/api/videoflow/scene-image', { projectId: currentProject.id, sceneId: scene.id },
        L('Dette lager ett stylet bilde for scenen.', 'This generates one styled image for this scene.'),
        function (data) { toast(L('🖼️ Bilde laget!', '🖼️ Image ready!')); patchScene(data.scene); });
    });
    actions.appendChild(imgBtn);

    var voiceBtn = document.createElement('button'); voiceBtn.className = 'btn ghost small'; voiceBtn.type = 'button';
    voiceBtn.textContent = '🔊 ' + (scene.voice && scene.voice.assetUrl ? L('Lag stemme på nytt', 'Regenerate voice') : L('Lag stemme', 'Generate voice'));
    voiceBtn.addEventListener('click', function () {
      paidAction('/api/videoflow/scene-voice', { projectId: currentProject.id, sceneId: scene.id },
        L('Dette leser inn scenens replikk med ElevenLabs.', "This reads this scene's narration aloud with ElevenLabs."),
        function (data) { toast(L('🔊 Stemme laget!', '🔊 Voice ready!')); patchScene(data.scene); });
    });
    actions.appendChild(voiceBtn);

    card.appendChild(body);
    return card;
  }

  function patchScene(updated) {
    var idx = currentProject.scenes.findIndex(function (s) { return s.id === updated.id; });
    if (idx !== -1) currentProject.scenes[idx] = updated;
    renderProject();
  }

  q('saveEditsBtn').addEventListener('click', function () {
    post('/api/videoflow/project', { action: 'save', project: currentProject }).then(function (res) {
      if (res.data && res.data.error) { toast(res.data.error); return; }
      currentProject = res.data.project; toast(L('💾 Lagret', '💾 Saved')); renderProject();
    });
  });

  var renderPollTimer = null;
  function renderRenderState(r) {
    var box = q('renderResults'); box.innerHTML = '';
    if (!r || r.status === 'not_started') return;
    if (r.status === 'rendering') {
      var n = document.createElement('div'); n.className = 'note';
      n.textContent = '🎬 ' + L('Setter sammen videoen …', 'Assembling the video …') + (r.progress ? ' (' + r.progress + ')' : '');
      box.appendChild(n);
    } else if (r.status === 'ready' && r.videoUrl) {
      var ok = document.createElement('div'); ok.className = 'note';
      var storageNote = r.stored ? L('Lagret permanent i R2.', 'Stored permanently in R2.') : L('Midlertidig lagring, last ned for å beholde.', 'Temporary storage, download to keep it.');
      ok.innerHTML = '<b>✅ ' + L('Ferdig video', 'Finished video') + '</b> (' + (r.durationSeconds || 0).toFixed(0) + 's)<br>' +
        '<video src="' + r.videoUrl + '" controls style="width:100%;border-radius:12px;margin-top:.5rem;"></video>' +
        '<div class="hint" style="margin-top:.4rem;">' + storageNote + '</div>';
      box.appendChild(ok);
    } else if (r.status === 'failed') {
      var err = document.createElement('div'); err.className = 'note'; err.style.color = '#a3241f';
      err.textContent = r.error || L('Sammenstillingen feilet.', 'Assembly failed.');
      box.appendChild(err);
    }
  }
  function pollRender() {
    if (renderPollTimer) clearInterval(renderPollTimer);
    var tries = 0;
    renderPollTimer = setInterval(function () {
      tries++;
      api('/api/videoflow/render?projectId=' + encodeURIComponent(currentProject.id)).then(function (res) {
        var r = res.data && res.data.render; if (!r) return;
        renderRenderState(r);
        if (r.status === 'ready' || r.status === 'failed' || tries > 120) clearInterval(renderPollTimer);
      }).catch(function () {});
    }, 5000);
  }
  q('renderBtn').addEventListener('click', function () {
    post('/api/videoflow/render', { projectId: currentProject.id }).then(function (res) {
      var d = res.data || {};
      if (d.missingSceneIds) { toast(L('Ikke alle scener har bilde/stemme ennå (' + d.missingSceneIds.length + ' mangler).', 'Not all scenes have image/voice yet (' + d.missingSceneIds.length + ' missing).')); }
      else if (d.ok && d.status === 'rendering') { toast(L('🎬 Setter sammen …', '🎬 Assembling …')); renderRenderState({ status: 'rendering' }); pollRender(); }
      else if (d.error) { toast(d.error); }
    });
  });

  if (currentLang === 'en') switchLanguage('en');
  refreshProjects();
  refreshBalance();
})();
</script>
</body>
</html>
