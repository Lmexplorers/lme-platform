<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<!-- Låst side: bare kjøpere (personlig lenke i e-posten) og eier slipper inn.
     Samme mønster som de andre betalte kursene, se js/course-gate.js. -->
<script>window.LME_COURSE_ID = "vault"; window.LME_COURSE_SALES_URL = "/vault";</script>
<script src="/js/course-gate.js?v=1"></script>
<title>LME Vault · ferdige Claude-maler</title>
<link rel="icon" href="/images/lme-logo.png">
<meta name="robots" content="noindex">

<style>
  /* Playpen Sans lastes lokalt, samme filer som resten av plattformen, så
     overskriftene aldri faller tilbake på systemfont om Google Fonts er nede. */
  @font-face { font-family: 'Playpen Sans'; src: url('/fonts/PlaypenSans-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Playpen Sans'; src: url('/fonts/PlaypenSans-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Playpen Sans'; src: url('/fonts/PlaypenSans-800.woff2') format('woff2'); font-weight: 800; font-style: normal; font-display: swap; }
  @font-face {
    font-family: 'Sasson Montessori';
    src: url('/fonts/SassoonMontessori.woff2') format('woff2'),
         url('/fonts/SassoonMontessori.ttf') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }

  :root {
    --lime: #A4D233; --lime-soft: #E8F5D1;
    --cerise: #E91E89; --cerise-soft: #FCE3F1;
    --sun: #F7C72E; --sun-soft: #FFF4D6;
    --bg: #FBF7F0; --bg-2: #FFFFFF;
    --ink: #1F1B24; --ink-soft: #5A5560; --ink-muted: #938E99;
    --line: rgba(31, 27, 36, 0.08);
    --r-md: 18px; --r-lg: 26px; --r-xl: 36px; --r-pill: 999px;
    --shadow-lg: 0 22px 60px rgba(31, 27, 36, 0.10);
    --font-body: 'Sasson Montessori', 'Playpen Sans', system-ui, sans-serif;
    --font-head: 'Playpen Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body); color: var(--ink);
    background:
      radial-gradient(1000px 560px at 100% -6%, var(--sun-soft) 0%, transparent 52%),
      radial-gradient(900px 520px at -5% 4%, var(--cerise-soft) 0%, transparent 50%),
      radial-gradient(800px 520px at 50% 112%, var(--lime-soft) 0%, transparent 55%),
      var(--bg);
    min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .wrap { max-width: 940px; margin: 0 auto; padding: 26px 22px 70px; }

  .brandbar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
  .brandbar img { height: 34px; }
  .brandbar .brandname { font-weight: 700; font-size: 15px; }

  .head { text-align: center; margin-bottom: 26px; }
  .chip {
    display: inline-block; background: var(--sun-soft); color: #8a6500;
    font-size: 12.5px; font-weight: 700; letter-spacing: .03em;
    padding: 7px 16px; border-radius: var(--r-pill); margin-bottom: 14px;
  }
  h1 { font-size: clamp(27px, 4.4vw, 40px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 12px; }
  .head p { font-size: 16px; color: var(--ink-soft); max-width: 620px; margin: 0 auto; }

  .toolbar {
    display: flex; gap: 10px; align-items: center; justify-content: center;
    flex-wrap: wrap; margin: 24px 0 22px;
  }
  .toolbar input {
    flex: 1 1 280px; max-width: 380px; font-size: 15px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: var(--r-pill);
    padding: 13px 20px; outline: none;
  }
  .toolbar input:focus { border-color: var(--cerise); box-shadow: 0 0 0 3px var(--cerise-soft); }
  .count { font-size: 13.5px; color: var(--ink-muted); }

  .list { display: grid; gap: 16px; }
  .mal {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--r-xl); box-shadow: 0 10px 34px rgba(31,27,36,.06);
    padding: 24px 26px;
  }
  .mal-top { display: flex; gap: 14px; align-items: flex-start; }
  .mal-top .ic { font-size: 26px; line-height: 1.1; flex-shrink: 0; }
  .mal h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; letter-spacing: -.01em; }
  .mal .hva { font-size: 14.5px; color: var(--ink-soft); }

  .prompt {
    position: relative; margin-top: 16px;
    background: #FAF7F2; border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 18px 20px;
  }
  .prompt pre {
    font-family: var(--font-body); font-size: 14px; line-height: 1.62;
    color: var(--ink); white-space: pre-wrap; word-break: break-word;
    max-height: 210px; overflow: hidden;
  }
  .prompt.open pre { max-height: none; }
  .prompt .fade {
    position: absolute; left: 1px; right: 1px; bottom: 1px; height: 62px;
    background: linear-gradient(to bottom, rgba(250,247,242,0), #FAF7F2 78%);
    border-radius: 0 0 var(--r-lg) var(--r-lg); pointer-events: none;
  }
  .prompt.open .fade { display: none; }

  .mal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .btn-copy {
    font-size: 14.5px; font-weight: 800; color: #fff;
    background: linear-gradient(120deg, var(--cerise), #ff5fb0);
    padding: 12px 20px; border-radius: var(--r-pill);
    box-shadow: 0 10px 22px rgba(233,30,137,.26);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .btn-copy:hover { transform: translateY(-2px); }
  .btn-copy.done { background: linear-gradient(120deg, #7fae1f, var(--lime)); box-shadow: 0 10px 22px rgba(127,174,31,.28); }
  .btn-more {
    font-size: 14px; font-weight: 700; color: var(--ink-soft);
    background: #fff; border: 1px solid var(--line);
    padding: 11px 18px; border-radius: var(--r-pill);
  }
  .btn-claude {
    font-size: 14px; font-weight: 700; color: var(--ink-soft);
    background: #fff; border: 1px solid var(--line);
    padding: 11px 18px; border-radius: var(--r-pill);
  }
  .tips {
    margin-top: 14px; font-size: 13.5px; color: #7a5e00;
    background: var(--sun-soft); border-radius: var(--r-md); padding: 12px 16px;
  }

  .bottom { margin-top: 40px; text-align: center; }
  .bottom a {
    display: inline-block; font-size: 15px; font-weight: 700; color: var(--ink-soft);
    background: #fff; border: 1px solid var(--line);
    padding: 13px 24px; border-radius: var(--r-pill);
  }
  .footer { text-align: center; margin-top: 34px; font-size: 13px; color: var(--ink-muted); }

  @media (max-width: 520px) {
    .wrap { padding: 20px 15px 54px; }
    .mal { padding: 20px 18px; }
  }

  /* Laast fontregel: Sasson Montessori paa alt unntatt overskrifter */
  h1, h2, h3, h4, h5, h6 { font-family: var(--font-head); }
  button, input, select, textarea { font-family: var(--font-body); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="brandbar" href="/academy" title="Til LME Studio">
      <img src="/images/lme-logo.png" alt="LME" onerror="this.style.display='none'">
      <span class="brandname">LME</span>
    </a>

    <div class="head">
      <span class="chip" data-no="DITT HVELV" data-en="YOUR VAULT">DITT HVELV</span>
      <h1 data-no="LME Vault" data-en="LME Vault">LME Vault</h1>
      <p data-no="Alle malene ligger klare her inne. Velg den som passer det du holder på med, trykk kopier, og lim den inn i Claude. Bytt ut det som står i klammer med ditt eget."
         data-en="Every template is ready in here. Pick the one that fits what you are working on, hit copy, and paste it into Claude. Replace everything in brackets with your own details.">Alle malene ligger klare her inne. Velg den som passer det du holder på med, trykk kopier, og lim den inn i Claude. Bytt ut det som står i klammer med ditt eget.</p>
    </div>

    <div class="toolbar">
      <input id="sok" type="search" data-no-placeholder="Søk i malene" data-en-placeholder="Search the templates" placeholder="Søk i malene" aria-label="Søk">
      <span class="count" id="antall"></span>
    </div>

    <div class="list" id="liste"></div>

    <div class="bottom">
      <a href="/academy" data-no="Til LME Studio" data-en="To LME Studio">Til LME Studio</a>
    </div>
    <div class="footer">© <span id="yr"></span> Little Montessori Explorers</div>
  </div>

  <script src="/js/vault-data.js?v=1"></script>
  <script>
    // Språk: samme valg som resten av plattformen (localStorage 'lme_lang'),
    // og ?lang=… overstyrer. Knappen bytter uten å laste siden på nytt.
    let LANG = (() => {
      const q = new URLSearchParams(location.search).get('lang');
      let l = (q || localStorage.getItem('lme_lang') || 'no').toLowerCase();
      if (l !== 'en' && l !== 'no') l = 'no';
      try { localStorage.setItem('lme_lang', l); } catch (e) {}
      return l;
    })();

    const items = window.LME_VAULT_ITEMS || [];
    const liste = document.getElementById('liste');
    const sok = document.getElementById('sok');

    function switchLanguage(lang) {
      LANG = lang;
      document.documentElement.lang = lang;
      try { localStorage.setItem('lme_lang', lang); } catch (e) {}
      document.querySelectorAll('[data-no][data-en]').forEach((el) => {
        el.textContent = lang === 'en' ? el.dataset.en : el.dataset.no;
      });
      document.querySelectorAll('[data-no-placeholder][data-en-placeholder]').forEach((el) => {
        el.placeholder = lang === 'en' ? el.dataset.enPlaceholder : el.dataset.noPlaceholder;
      });
      const b = document.getElementById('langBtn');
      if (b) b.textContent = lang === 'en' ? '🇳🇴 Norsk' : '🇬🇧 English';
      tegn();
    }

    (() => {
      const b = document.createElement('button');
      b.id = 'langBtn';
      b.setAttribute('aria-label', 'Bytt språk / Switch language');
      // Plasseres til venstre for kontoknappen (js/lme-account.js), som selv
      // ligger øverst til høyre, slik at de to ikke havner oppå hverandre.
      b.style.cssText = 'position:fixed;top:18px;right:74px;z-index:300;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(31,27,36,.12);background:#fff;color:#1F1B24;font-family:inherit;font-weight:700;font-size:13px;line-height:1;padding:10px 15px;border-radius:999px;box-shadow:0 6px 20px rgba(31,27,36,.12);cursor:pointer;';
      b.addEventListener('click', () => switchLanguage(LANG === 'en' ? 'no' : 'en'));
      document.body.appendChild(b);
    })();

    function tegn() {
      const q = (sok.value || '').trim().toLowerCase();
      liste.innerHTML = '';
      let vist = 0;

      items.forEach((it) => {
        const t = it[LANG] || it.no;
        const hay = (t.tittel + ' ' + t.hva + ' ' + t.prompt).toLowerCase();
        if (q && hay.indexOf(q) === -1) return;
        vist++;

        const card = document.createElement('article');
        card.className = 'mal';
        card.innerHTML =
          '<div class="mal-top"><span class="ic"></span><div><h2></h2><p class="hva"></p></div></div>' +
          '<div class="prompt"><pre></pre><span class="fade"></span></div>' +
          '<div class="mal-actions">' +
            '<button class="btn-copy"></button>' +
            '<button class="btn-more"></button>' +
            '<a class="btn-claude" href="https://claude.ai/new" target="_blank" rel="noopener"></a>' +
          '</div>' +
          '<p class="tips"></p>';

        card.querySelector('.ic').textContent = it.ikon;
        card.querySelector('h2').textContent = t.tittel;
        card.querySelector('.hva').textContent = t.hva;
        card.querySelector('pre').textContent = t.prompt;
        card.querySelector('.tips').textContent = (LANG === 'en' ? 'Tip: ' : 'Tips: ') + t.tips;

        const boks = card.querySelector('.prompt');
        const mer = card.querySelector('.btn-more');
        mer.textContent = LANG === 'en' ? 'Show all' : 'Vis alt';
        mer.addEventListener('click', () => {
          boks.classList.toggle('open');
          mer.textContent = boks.classList.contains('open')
            ? (LANG === 'en' ? 'Show less' : 'Vis mindre')
            : (LANG === 'en' ? 'Show all' : 'Vis alt');
        });

        card.querySelector('.btn-claude').textContent = LANG === 'en' ? 'Open Claude' : 'Åpne Claude';

        const kopi = card.querySelector('.btn-copy');
        const merke = LANG === 'en' ? 'Copy the template' : 'Kopier malen';
        const gjort = LANG === 'en' ? 'Copied' : 'Kopiert';
        kopi.textContent = merke;
        kopi.addEventListener('click', () => {
          kopier(t.prompt).then((ok) => {
            kopi.textContent = ok ? gjort : (LANG === 'en' ? 'Select and copy' : 'Merk og kopier');
            kopi.classList.toggle('done', ok);
            if (!ok) boks.classList.add('open');
            setTimeout(() => { kopi.textContent = merke; kopi.classList.remove('done'); }, 2200);
          });
        });

        liste.appendChild(card);
      });

      const antall = document.getElementById('antall');
      antall.textContent = LANG === 'en'
        ? vist + ' of ' + items.length + ' templates'
        : vist + ' av ' + items.length + ' maler';
    }

    // Kopiering: clipboard-API der det finnes, ellers et gammeldags fallback
    // (Safari i private vinduer og eldre nettlesere nekter det moderne).
    function kopier(tekst) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(tekst).then(() => true).catch(() => reserve(tekst));
      }
      return Promise.resolve(reserve(tekst));
    }
    function reserve(tekst) {
      try {
        const ta = document.createElement('textarea');
        ta.value = tekst;
        ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }

    sok.addEventListener('input', tegn);
    document.getElementById('yr').textContent = new Date().getFullYear();
    switchLanguage(LANG);
  </script>
<script src="/js/lme-account.js?v=11" defer></script>
</body>
</html>
