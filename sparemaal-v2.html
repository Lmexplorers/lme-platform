<!DOCTYPE html>
<!-- Sparemål redesigned with reference layout - 2026-07-30 -->
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <title>Sparemål — LME</title>
  <meta name="description" content="Spin ukentlig, spar stabilt, nå sparemålet ditt.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Sasson Montessori';
      src: url('/fonts/SassoonMontessori.woff2') format('woff2'), url('/fonts/SassoonMontessori.ttf') format('truetype');
      font-weight: normal; font-style: normal; font-display: swap;
    }
    :root {
      --pink: #F8D7DA; --pink-mid: #F5A8B8; --cerise: #E91E89;
      --lime: #7AAE1F; --yellow: #F7C72E; --cream: #FBF6F0;
      --ink: #1A1A1A; --grey: #4A4A4A; --line: rgba(26,26,26,0.1);
      --green-header: #D8EDD1; --pink-header: #F5D6E5;
      --font-head: 'Playpen Sans', system-ui, sans-serif;
      --font-body: 'Sasson Montessori', 'Playpen Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); color: var(--ink); background: linear-gradient(180deg, #FDF5F1 0%, #FBEAE9 55%, #F8D7DA 100%); min-height: 100vh; line-height: 1.5; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-head); }
    a { color: inherit; text-decoration: none; }

    .wrap { max-width: 600px; margin: 0 auto; padding: 28px 20px 60px; }
    .head { text-align: center; margin-bottom: 28px; }
    .head .kick { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cerise); margin-bottom: 8px; }
    .head h1 { font-size: 32px; font-weight: 700; margin-bottom: 6px; }
    .head .tagline { font-size: 14px; color: var(--grey); font-style: italic; margin-bottom: 16px; }

    .top-actions { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
    .record-btn { background: #2a2a2a; color: #fff; padding: 11px 28px; border-radius: 999px; border: 0; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(42,42,42,0.15); }
    .record-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(42,42,42,0.2); }
    .info-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s ease; }
    .info-btn:hover { background: #f8f8f8; }

    .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .card-field { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(26,26,26,0.05); }
    .card-field .header { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 10px 12px; border-radius: 10px; margin: -16px -16px 12px -16px; text-align: center; }
    .card-field.green .header { background: var(--green-header); color: #5a8a4a; }
    .card-field.pink .header { background: var(--pink-header); color: #c13d6a; }
    .card-field .value { font-size: 24px; font-weight: 700; color: var(--ink); text-align: center; }

    .already-saved { font-size: 13px; color: var(--grey); text-align: center; margin-bottom: 24px; padding: 0 12px; }

    .section-label { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--grey); margin: 28px 0 16px 0; }

    .progress-section { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(26,26,26,0.05); }
    .progress-circle { position: relative; width: 140px; height: 140px; margin: 0 auto 16px; }
    .progress-bg { width: 100%; height: 100%; border-radius: 50%; background: #f0f0f0; position: relative; overflow: hidden; }
    .progress-fill { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--pink-mid) 0deg, var(--pink-mid) var(--progress-angle), #f0f0f0 var(--progress-angle), #f0f0f0 360deg); --progress-angle: 0deg; }
    .progress-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(100% - 16px); height: calc(100% - 16px); border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .progress-percent { font-size: 28px; font-weight: 700; color: var(--cerise); }
    .progress-label { font-size: 11px; color: var(--grey); }

    .wheel-container { position: relative; width: 100%; aspect-ratio: 1; max-width: 280px; margin: 20px auto; }
    .wheel-canvas { width: 100%; height: 100%; }
    .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 12px solid var(--cerise); z-index: 10; }

    .spin-btn { background: linear-gradient(135deg, var(--cerise), #d1166d); color: #fff; padding: 12px 28px; border-radius: 999px; border: 0; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(233,30,137,0.15); margin: 16px auto 0; display: block; }
    .spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(233,30,137,0.25); }
    .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .input-group { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(26,26,26,0.05); }
    .input-group label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--grey); margin-bottom: 8px; }
    .input-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 16px; }
    .input-group input:focus { outline: none; border-color: var(--cerise); box-shadow: 0 0 0 2px rgba(233,30,137,0.1); }

    .lang-toggle { position: fixed; bottom: 20px; right: 20px; background: #fff; border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(26,26,26,0.1); }
    .lang-toggle:hover { background: #f8f8f8; }

    .challenge-action { background: linear-gradient(135deg, var(--lime), #5a9616); color: #fff; padding: 12px 20px; border-radius: 999px; border: 0; font-weight: 700; font-size: 13px; cursor: pointer; width: 100%; margin-top: 16px; transition: all 0.2s ease; }
    .challenge-action:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(122,174,31,0.2); }

    @media (max-width: 520px) {
      .head h1 { font-size: 28px; }
      .wrap { padding: 20px 16px 60px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="kick" data-no="SPAREMÅL" data-en="SAVINGS GOAL">SPAREMÅL</span>
      <h1 data-no="Sparemål" data-en="Savings Planner">Sparemål</h1>
      <div class="tagline" data-no="Spin ukentlig • Spar stabilt • Nå sparemålet ditt" data-en="Spin weekly • Save steadily • Reach your goal">Spin ukentlig • Spar stabilt • Nå sparemålet ditt</div>
    </div>

    <div class="top-actions">
      <button class="record-btn" id="recordBtnTop" data-no="🎯 REGISTRER" data-en="🎯 RECORD">🎯 REGISTRER</button>
      <button class="info-btn" id="infoBtn" title="Info">ⓘ</button>
    </div>

    <div class="grid-2x2">
      <div class="card-field green">
        <div class="header" data-no="Utfordring startet" data-en="Challenge Started">Utfordring startet</div>
        <div class="value" id="challengeStartedVal">–</div>
      </div>
      <div class="card-field pink">
        <div class="header" data-no="Mål" data-en="Goal">Mål</div>
        <div class="value" id="goalVal">kr 100 000</div>
      </div>
      <div class="card-field green">
        <div class="header" data-no="Spart så langt" data-en="Saved So Far">Spart så langt</div>
        <div class="value" id="savedVal">kr 0</div>
      </div>
      <div class="card-field pink">
        <div class="header" data-no="Igjen til mål" data-en="Left to Goal">Igjen til mål</div>
        <div class="value" id="leftToGoalVal">kr 100 000</div>
      </div>
    </div>

    <div class="already-saved" id="alreadySavedText" data-no="Spart før utfordring: kr 0" data-en="Already saved before challenge: kr 0">Spart før utfordring: kr 0</div>

    <div class="section-label" data-no="SPAREMÅL" data-en="SAVINGS GOAL">SPAREMÅL</div>
    <div class="progress-section">
      <div class="progress-circle">
        <div class="progress-bg">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-inner">
          <div class="progress-percent" id="progressPercent">0%</div>
          <div class="progress-label" id="progressOfLabel" data-no="av kr 100 000" data-en="of kr 100,000">av kr 100 000</div>
        </div>
      </div>
    </div>

    <div class="section-label" data-no="DENNE UKEN" data-en="THIS WEEK">DENNE UKEN</div>
    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <canvas class="wheel-canvas" id="wheelCanvas"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn" data-no="SPIN HJULET" data-en="SPIN WHEEL">SPIN HJULET</button>

    <div class="input-group">
      <label for="amountInput" data-no="Eller skriv beløp (50-2000 kr)" data-en="Or enter amount (50-2000 kr)">Eller skriv beløp (50-2000 kr)</label>
      <input type="number" id="amountInput" min="50" max="2000" step="50" placeholder="kr">
    </div>

    <button class="challenge-action" id="newChallengeBtn" data-no="Start ny utfordring" data-en="Start new challenge">Start ny utfordring</button>
  </div>

  <button class="lang-toggle" id="langToggle" data-no="🇬🇧 English" data-en="🇳🇴 Norsk">🇬🇧 English</button>

  <script>
    const AMOUNTS = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000];
    const GOAL = 100000;

    let state = {
      goal: GOAL,
      saved: 0,
      history: [],
      previousSavings: 0,
      challengeStartDate: null,
      lastSpin: null
    };

    let currentLang = localStorage.getItem('sparemaal-lang') || 'no';
    let wheelRotation = 0;
    let isSpinning = false;

    const els = {
      wheelCanvas: document.getElementById('wheelCanvas'),
      spinBtn: document.getElementById('spinBtn'),
      recordBtnTop: document.getElementById('recordBtnTop'),
      amountInput: document.getElementById('amountInput'),
      langToggle: document.getElementById('langToggle'),
      newChallengeBtn: document.getElementById('newChallengeBtn'),
      infoBtn: document.getElementById('infoBtn'),
      progressFill: document.getElementById('progressFill'),
      progressPercent: document.getElementById('progressPercent'),
      challengeStartedVal: document.getElementById('challengeStartedVal'),
      savedVal: document.getElementById('savedVal'),
      leftToGoalVal: document.getElementById('leftToGoalVal'),
      alreadySavedText: document.getElementById('alreadySavedText')
    };

    function loadState() {
      const stored = localStorage.getItem('sparemaal-state');
      if (stored) {
        try {
          state = JSON.parse(stored);
        } catch (e) {}
      }
    }

    function saveState() {
      localStorage.setItem('sparemaal-state', JSON.stringify(state));
    }

    function drawWheel() {
      const canvas = els.wheelCanvas;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const w = rect.width / 2;
      const h = rect.height / 2;
      const r = Math.min(w, h) - 8;
      const segmentAngle = (360 / AMOUNTS.length) * Math.PI / 180;

      const colors = ['#FFE9F5', '#D8EDD1', '#FFF4D6', '#D8EEFF', '#E8F5D1', '#EFE5FF'];
      AMOUNTS.forEach((amount, i) => {
        const startAngle = (i * segmentAngle) - Math.PI / 2 + (wheelRotation * Math.PI / 180);
        const endAngle = startAngle + segmentAngle;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.moveTo(w, h);
        ctx.arc(w, h, r, startAngle, endAngle);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    function updateDisplay() {
      const weekStart = getMonday(new Date());
      const weekSaved = state.history.filter(e => new Date(e.date) >= weekStart).reduce((sum, e) => sum + e.amount, 0);
      const remaining = Math.max(0, state.goal - state.saved);
      const percent = Math.round((state.saved / state.goal) * 100);

      els.progressPercent.textContent = percent + '%';
      els.progressFill.style.setProperty('--progress-angle', (percent * 3.6) + 'deg');

      const fmt = (n) => 'kr ' + n.toLocaleString('no-NO');
      els.savedVal.textContent = fmt(state.saved);
      els.leftToGoalVal.textContent = fmt(remaining);

      if (state.challengeStartDate) {
        const startDate = new Date(state.challengeStartDate);
        const dd = String(startDate.getDate()).padStart(2, '0');
        const mm = String(startDate.getMonth() + 1).padStart(2, '0');
        const yyyy = startDate.getFullYear();
        els.challengeStartedVal.textContent = dd + '.' + mm + '.' + yyyy;
      } else {
        els.challengeStartedVal.textContent = '–';
      }

      const prevTxt = currentLang === 'no' ? 'Spart før utfordring: ' : 'Already saved before challenge: ';
      els.alreadySavedText.textContent = prevTxt + fmt(state.previousSavings);
    }

    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      els.spinBtn.disabled = true;

      const targetIdx = Math.floor(Math.random() * AMOUNTS.length);
      const targetAngle = (targetIdx * (360 / AMOUNTS.length)) + (360 * 5);
      const startAngle = wheelRotation % 360;
      const diff = targetAngle - startAngle;
      const duration = 1000;
      const start = Date.now();

      function frame() {
        const elapsed = Date.now() - start;
        const t = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - t, 3);
        wheelRotation = startAngle + diff * easeOut;
        drawWheel();

        if (t < 1) requestAnimationFrame(frame);
        else {
          wheelRotation = targetAngle % 360;
          drawWheel();
          addAmount(AMOUNTS[targetIdx]);
          isSpinning = false;
          els.spinBtn.disabled = false;
        }
      }
      requestAnimationFrame(frame);
    }

    function addAmount(amount) {
      if (!state.challengeStartDate) {
        state.challengeStartDate = new Date().toISOString();
      }
      state.saved += amount;
      state.history.push({ date: new Date().toISOString(), amount });
      saveState();
      updateDisplay();
      els.amountInput.value = '';
    }

    function switchLanguage() {
      currentLang = currentLang === 'no' ? 'en' : 'no';
      localStorage.setItem('sparemaal-lang', currentLang);
      document.querySelectorAll('[data-no][data-en]').forEach(el => {
        el.textContent = el.dataset[currentLang === 'no' ? 'no' : 'en'];
      });
      updateDisplay();
    }

    loadState();
    drawWheel();
    updateDisplay();

    els.spinBtn.addEventListener('click', spin);
    els.recordBtnTop.addEventListener('click', () => els.amountInput.focus());
    els.langToggle.addEventListener('click', switchLanguage);
    els.newChallengeBtn.addEventListener('click', () => {
      state.previousSavings += state.saved;
      state.saved = 0;
      state.history = [];
      state.challengeStartDate = new Date().toISOString();
      saveState();
      updateDisplay();
    });

    els.amountInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && els.amountInput.value) {
        const amount = parseInt(els.amountInput.value);
        if (amount >= 50 && amount <= 2000) addAmount(amount);
      }
    });

    els.infoBtn.addEventListener('click', () => {
      alert(currentLang === 'no'
        ? 'Spin hjulet for å finne sparemålet din uke. Eller skriv inn beløp manuelt.\nStart ny utfordring når du er klar for en ny runde.'
        : 'Spin the wheel to find your weekly savings goal. Or enter an amount manually.\nStart a new challenge when you\'re ready for a new round.');
    });

    window.addEventListener('resize', drawWheel);

    // Set initial language
    switchLanguage();
  </script>
</body>
</html>
