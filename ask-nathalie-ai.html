<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-no="Spør Nathalie AI" data-en="Ask Nathalie AI">Spør Nathalie AI</title>
<meta name="description" data-no="Chat med Nathalie AI, din personlige assistent på LME Studio. Få hjelp med kreativitet, læring, synlighet og vekst." data-en="Chat with Nathalie AI, your personal assistant on LME Studio. Get help with creativity, learning, visibility and growth.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Sasson Montessori';
    src:url('/fonts/SassoonMontessori.woff2') format('woff2'),
        url('/fonts/SassoonMontessori.ttf') format('truetype');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --pink-50:#fff5f8;--pink-100:#ffe8f0;--pink-200:#ffd1e1;--pink-300:#ffb3cd;
    --pink-400:#ff8ab3;--pink-500:#e85a92;--pink-600:#c43d75;--pink-700:#8f2a55;
    --gold:#caa46a;--gold-soft:#f4ead7;
    --cream:#fffcf9;--ink:#3d2438;--ink-soft:#6b4760;--ink-muted:#9a8693;
    --line:#f0dde6;
    --shadow-soft:0 10px 40px -18px rgba(196,61,117,.32);
    --shadow-med:0 24px 60px -24px rgba(80,30,60,.4);
    --font-head:'Playpen Sans',system-ui,sans-serif;
    --font-body:'Sasson Montessori','Playpen Sans',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{--cream:#170f15;--ink:#f4e9ef;--ink-soft:#c9b3c2;--ink-muted:#977f90;--line:#3a2a38;
      --pink-50:#241823;--pink-100:#2e1826;--gold-soft:#2a2416;}
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}*{animation:none!important;transition:none!important;}}
  body{font-family:var(--font-body);color:var(--ink);line-height:1.6;background:
    radial-gradient(ellipse 70% 45% at 15% -5%,rgba(255,209,225,.4),transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 0,rgba(244,234,215,.5),transparent 55%),
    var(--cream);min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3,h4{font-family:var(--font-head);font-weight:800;line-height:1.1;color:var(--ink);letter-spacing:-.02em;}
  a{color:var(--pink-600);text-decoration:none;}

  .top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 26px;
    background:var(--cream);border-bottom:1px solid var(--line);}
  .top .brand{display:flex;align-items:center;gap:9px;color:var(--ink);}
  .top .brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--pink-500),var(--pink-600));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:800;font-size:14px;}
  .top .brand b{font-family:var(--font-head);font-weight:800;font-size:16px;}
  .top .sp{flex:1;}
  .lang{font-family:var(--font-head);font-weight:700;font-size:13px;border:1.5px solid var(--pink-200);
    background:var(--cream);color:var(--pink-600);border-radius:999px;padding:7px 13px;cursor:pointer;}
  .btn{font-family:var(--font-head);font-weight:700;font-size:15px;border:none;border-radius:999px;cursor:pointer;
    padding:13px 24px;transition:transform .15s,box-shadow .15s;display:inline-block;text-align:center;}
  .btn:active{transform:scale(.98);}
  .btn-p{background:linear-gradient(120deg,var(--pink-500),var(--pink-600));color:#fff;box-shadow:0 14px 30px -12px rgba(196,61,117,.7);}
  .btn-p:hover{transform:translateY(-2px);}
  .btn-g{background:var(--cream);border:1.5px solid var(--line);color:var(--ink-soft);}
  .btn-s{background:none;border:none;color:var(--pink-600);font-size:14px;padding:6px 0;cursor:pointer;}
  .top .btn{padding:9px 18px;font-size:14px;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 26px;width:100%;}

  /* chat container */
  .chat-container{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .chat-messages{flex:1;overflow-y:auto;padding:28px 26px;display:flex;flex-direction:column;gap:16px;}
  .message{display:flex;gap:12px;animation:slideIn .3s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .message.user{justify-content:flex-end;}
  .message.user .bubble{background:linear-gradient(120deg,var(--pink-500),var(--pink-600));color:#fff;}
  .message.nathalie .bubble{background:var(--pink-50);color:var(--ink);}
  .bubble{border-radius:18px;padding:14px 18px;max-width:70%;font-size:15px;line-height:1.5;}
  .nathalie-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink-500),var(--pink-600));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;}

  /* intro */
  .intro{background:linear-gradient(135deg,rgba(232,90,146,.08),rgba(244,234,215,.08));border:1px solid var(--line);
    border-radius:20px;padding:24px;margin-bottom:20px;}
  .intro h2{font-size:18px;margin-bottom:12px;}
  .intro p{color:var(--ink-soft);font-size:14px;margin-bottom:16px;}
  .suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
  .suggestion{background:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;
    transition:all .2s;font-size:13px;font-family:var(--font-head);font-weight:600;color:var(--pink-600);}
  .suggestion:hover{background:var(--pink-50);border-color:var(--pink-300);}

  /* input */
  .chat-input{border-top:1px solid var(--line);background:var(--cream);padding:16px 26px;display:flex;gap:10px;align-items:flex-end;}
  .input-group{flex:1;display:flex;gap:8px;}
  textarea{font-family:var(--font-body);font-size:15px;color:var(--ink);background:var(--pink-50);
    border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;resize:none;min-height:44px;max-height:120px;
    font-weight:500;}
  textarea:focus{outline:none;border-color:var(--pink-400);}
  .send-btn{background:linear-gradient(120deg,var(--pink-500),var(--pink-600));color:#fff;border:none;
    border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700;transition:transform .15s;}
  .send-btn:hover{transform:translateY(-2px);}
  .send-btn:active{transform:scale(.98);}
  .send-btn:disabled{opacity:.5;cursor:not-allowed;}

  /* powers badge */
  .powers-badge{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:12px;}
  .power-tag{background:rgba(196,61,117,.1);color:var(--pink-600);border-radius:999px;padding:5px 10px;
    font-family:var(--font-head);font-weight:600;}

  /* empty state */
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px 20px;}
  .empty-state h2{font-size:28px;margin-bottom:12px;}
  .empty-state p{color:var(--ink-soft);max-width:50ch;margin-bottom:24px;}

  @media(max-width:600px){
    .chat-messages{padding:16px;}
    .bubble{max-width:90%;}
    .suggestions{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="/nathalie-ai-info">
    <span class="mk">N</span>
    <b data-no="Nathalie AI" data-en="Nathalie AI">Nathalie AI</b>
  </a>
  <div class="sp"></div>
  <button class="lang" id="lang">EN 🌍</button>
</div>

<div class="chat-container">
  <div class="chat-messages" id="messages">
    <!-- Messages appear here -->
  </div>
</div>

<div class="chat-input">
  <div class="input-group">
    <textarea id="input" placeholder="Spør meg om hva som helst..." data-no-ph="Spør meg om hva som helst..." data-en-ph="Ask me anything..." rows="1"></textarea>
    <button class="send-btn" id="send" data-no="Send" data-en="Send">Send</button>
  </div>
</div>

<script>
(function(){
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const langBtn = document.getElementById('lang');

  let lang = (localStorage.getItem('lme-lang') === 'en') ? 'en' : 'no';
  let messages = [];

  const intro = {
    no: {
      title: "Hallo! 👋 Jeg er Nathalie",
      text: "Din personlige AI-assistent på LME Studio. Jeg hjelper deg med kreativitet, læring, synlighet og vekst – fra Montessori-filosofi til branding, innholdsskap, produktutvikling, markedsføring og forretningsbygging. Hva kan jeg hjelpe deg med?",
      suggestions: [
        "Hva kan jeg lage?",
        "Hvordan får jeg synlighet?",
        "Tips til branding",
        "Produktutvikling 101",
        "Hvordan starte?",
        "Prompts for innhold"
      ]
    },
    en: {
      title: "Hello! 👋 I'm Nathalie",
      text: "Your personal AI assistant on LME Studio. I help you with creativity, learning, visibility and growth – from Montessori philosophy to branding, content creation, product development, marketing and business building. What can I help you with?",
      suggestions: [
        "What can I create?",
        "How do I get visibility?",
        "Branding tips",
        "Product development 101",
        "How to get started?",
        "Content prompts"
      ]
    }
  };

  function applyLang() {
    document.querySelectorAll('[data-no-ph],[data-en-ph]').forEach(el => {
      const ph = el.getAttribute(`data-${lang}-ph`);
      if (ph) el.placeholder = ph;
    });
    document.querySelectorAll('[data-no],[data-en]').forEach(el => {
      const t = el.getAttribute(`data-${lang}`);
      if (t) el.textContent = t;
    });
  }

  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    try { localStorage.setItem('lme-lang', l); } catch(e) {}
    langBtn.textContent = l === 'no' ? 'EN 🌍' : 'NO 🇳🇴';
    applyLang();
  }

  function showIntro() {
    messagesEl.innerHTML = '';
    const intData = intro[lang];
    const msg = document.createElement('div');
    msg.className = 'message nathalie';
    msg.innerHTML = `
      <div class="nathalie-avatar">N</div>
      <div style="flex:1;">
        <h2 style="font-size:18px;margin-bottom:8px;color:var(--ink);">${intData.title}</h2>
        <div class="bubble" style="margin-bottom:16px;">${intData.text}</div>
        <div class="suggestions">
          ${intData.suggestions.map(s => `<button class="suggestion">${s}</button>`).join('')}
        </div>
        <div class="powers-badge">
          <span class="power-tag">📚 Montessori</span>
          <span class="power-tag">🎨 Branding</span>
          <span class="power-tag">🎬 Innhold</span>
          <span class="power-tag">💡 Prompts</span>
          <span class="power-tag">🏪 Produkter</span>
          <span class="power-tag">🎯 Målgruppe</span>
          <span class="power-tag">🚀 Vekst</span>
        </div>
      </div>
    `;
    messagesEl.appendChild(msg);

    // Add click handlers to suggestions
    msg.querySelectorAll('.suggestion').forEach(btn => {
      btn.addEventListener('click', () => {
        inputEl.value = btn.textContent;
        inputEl.focus();
        send();
      });
    });
  }

  function addMessage(text, isUser) {
    const msg = document.createElement('div');
    msg.className = `message ${isUser ? 'user' : 'nathalie'}`;
    if (!isUser) {
      msg.innerHTML = `
        <div class="nathalie-avatar">N</div>
        <div class="bubble">${escapeHtml(text)}</div>
      `;
    } else {
      msg.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    }
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    addMessage(text, true);
    sendBtn.disabled = true;

    try {
      const response = await fetch('/api/ask-nathalie', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text, lang: lang })
      });
      const data = await response.json();
      if (data.answer) addMessage(data.answer, false);
    } catch(e) {
      const errMsg = lang === 'no'
        ? 'Beklager, jeg kunne ikke svare akkurat nå. Prøv igjen om litt.'
        : 'Sorry, I couldn\'t respond right now. Try again in a moment.';
      addMessage(errMsg, false);
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  langBtn.addEventListener('click', () => setLang(lang === 'no' ? 'en' : 'no'));
  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  applyLang();
  showIntro();
})();
</script>
<script src="/js/lme-account.js?v=11" defer></script>
<script src="/js/renate-widget.js?v=5" defer></script>
</body>
</html>
