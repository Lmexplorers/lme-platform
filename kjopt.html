<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>Takk for kjøpet · LME</title>
<link rel="icon" href="/images/lme-logo.png">
<meta name="robots" content="noindex">
<style>
  @font-face {
    font-family: 'Sasson Montessori';
    src: url('/fonts/SassoonMontessori.woff2') format('woff2'),
         url('/fonts/SassoonMontessori.ttf') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  @font-face { font-family: 'Playpen Sans'; src: url('/fonts/PlaypenSans-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Playpen Sans'; src: url('/fonts/PlaypenSans-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Playpen Sans'; src: url('/fonts/PlaypenSans-800.woff2') format('woff2'); font-weight: 800; font-style: normal; font-display: swap; }
  :root{
    --lime:#A4D233;--lime-soft:#E8F5D1;--cerise:#E91E89;--cerise-soft:#FCE3F1;
    --sun:#F7C72E;--sun-soft:#FFF4D6;--bg:#FBF7F0;--bg-2:#fff;
    --ink:#1F1B24;--ink-soft:#5A5560;--ink-muted:#938E99;--line:rgba(31,27,36,.08);
    --r-lg:26px;--r-xl:36px;--r-pill:999px;
    --font-body:'Sasson Montessori','Playpen Sans',system-ui,sans-serif;
    --font-head:'Playpen Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font-body);color:var(--ink);line-height:1.6;min-height:100vh;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 520px at 50% -10%, var(--lime-soft) 0%, transparent 55%),
      radial-gradient(700px 460px at 100% 100%, var(--sun-soft) 0%, transparent 55%),
      var(--bg);
  }
  .wrap{max-width:560px;width:100%;padding:38px 22px;text-align:center}
  .brandbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px}
  .brandbar img{height:32px}
  .brandbar span{font-weight:700;font-size:15px}
  .seal{width:82px;height:82px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,var(--lime),#7fae1f);
    display:flex;align-items:center;justify-content:center;box-shadow:0 16px 36px rgba(127,174,31,.32);font-size:38px}
  h1{font-size:clamp(25px,4.6vw,34px);font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
  .lead{font-size:16px;color:var(--ink-soft);margin-bottom:24px}
  .kort{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:0 16px 44px rgba(31,27,36,.08);padding:28px 26px;text-align:left}
  label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
  input{width:100%;font-size:16px;color:var(--ink);background:#FAF7F2;border:1px solid var(--line);border-radius:var(--r-pill);padding:14px 20px;outline:none;margin-bottom:14px}
  input:focus{border-color:var(--cerise);box-shadow:0 0 0 3px var(--cerise-soft)}
  button{width:100%;font-family:var(--font-body);font-size:16.5px;font-weight:800;padding:16px 22px;border:none;border-radius:var(--r-pill);
    cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--cerise),#ff5fb0);box-shadow:0 12px 28px rgba(233,30,137,.3)}
  button[disabled]{opacity:.6;cursor:default}
  .svar{margin-top:18px;border-radius:var(--r-lg);padding:16px 18px;font-size:14.5px;display:none}
  .svar.ok{background:var(--lime-soft);color:#4d6a10;display:block}
  .svar.feil{background:var(--cerise-soft);color:#a11360;display:block}
  .knapp-inn{display:inline-block;margin-top:14px;font-weight:800;font-size:15px;color:#fff;background:#6f9a17;padding:13px 22px;border-radius:var(--r-pill);text-decoration:none}
  .footer{margin-top:26px;font-size:13px;color:var(--ink-muted)}
  h1,h2,h3{font-family:var(--font-head)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brandbar">
      <img src="/images/lme-logo.png" alt="LME" onerror="this.style.display='none'">
      <span>LME</span>
    </div>
    <div class="seal">✓</div>
    <h1 data-no="Takk for kjøpet" data-en="Thank you for your purchase">Takk for kjøpet</h1>
    <p class="lead" data-no="Skriv e-posten du vil bruke, så får du tilgangen med det samme, og en personlig lenke på e-post."
       data-en="Enter the email you want to use, and you get access right away, plus a personal link by email.">Skriv e-posten du vil bruke, så får du tilgangen med det samme, og en personlig lenke på e-post.</p>

    <div class="kort">
      <label for="epost" data-no="E-postadressen din" data-en="Your email address">E-postadressen din</label>
      <input id="epost" type="email" autocomplete="email" placeholder="deg@example.com">
      <label for="navn" data-no="Navnet ditt (valgfritt)" data-en="Your name (optional)">Navnet ditt (valgfritt)</label>
      <input id="navn" type="text" autocomplete="name">
      <button id="knapp" data-no="Gi meg tilgang" data-en="Give me access">Gi meg tilgang</button>
      <div class="svar" id="svar"></div>
    </div>
    <div class="footer">© <span id="yr"></span> Little Montessori Explorers</div>
  </div>

  <script>
    var LANG = (function () {
      var q = new URLSearchParams(location.search).get('lang');
      var l = (q || localStorage.getItem('lme_lang') || 'no').toLowerCase();
      if (l !== 'en' && l !== 'no') l = 'no';
      try { localStorage.setItem('lme_lang', l); } catch (e) {}
      return l;
    })();
    function switchLanguage(lang) {
      LANG = lang;
      document.documentElement.lang = lang;
      try { localStorage.setItem('lme_lang', lang); } catch (e) {}
      document.querySelectorAll('[data-no][data-en]').forEach(function (el) {
        el.textContent = lang === 'en' ? el.dataset.en : el.dataset.no;
      });
      var b = document.getElementById('langBtn');
      if (b) b.textContent = lang === 'en' ? '🇳🇴 Norsk' : '🇬🇧 English';
    }
    (function () {
      var b = document.createElement('button');
      b.id = 'langBtn';
      b.style.cssText = 'position:fixed;top:16px;right:16px;width:auto;z-index:300;border:1px solid rgba(31,27,36,.12);background:#fff;color:#1F1B24;font-weight:700;font-size:13px;padding:10px 15px;border-radius:999px;box-shadow:0 6px 20px rgba(31,27,36,.12);cursor:pointer;';
      b.addEventListener('click', function () { switchLanguage(LANG === 'en' ? 'no' : 'en'); });
      document.body.appendChild(b);
    })();

    // Adressen er /kjopt/<slug>?n=<nøkkel>
    var deler = location.pathname.replace(/\/+$/, '').split('/');
    var slug = deler[deler.length - 1] || '';
    var nokkel = new URLSearchParams(location.search).get('n') || '';

    var knapp = document.getElementById('knapp');
    var svar = document.getElementById('svar');
    function vis(klasse, tekst, lenke) {
      svar.className = 'svar ' + klasse;
      svar.textContent = tekst;
      if (lenke) {
        var a = document.createElement('a');
        a.className = 'knapp-inn';
        a.href = lenke;
        a.textContent = LANG === 'en' ? 'Open the course' : 'Åpne kurset';
        svar.appendChild(document.createElement('br'));
        svar.appendChild(a);
      }
    }

    knapp.addEventListener('click', function () {
      var epost = document.getElementById('epost').value.trim();
      if (!epost) { document.getElementById('epost').focus(); return; }
      knapp.disabled = true;
      vis('ok', LANG === 'en' ? 'One moment…' : 'Et øyeblikk…');
      fetch('/api/kjopt', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: slug, n: nokkel, epost: epost, navn: document.getElementById('navn').value.trim() }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok) {
            vis('ok', LANG === 'en'
              ? 'You are in. The link is also in your inbox, and it works forever.'
              : 'Du er inne. Lenken ligger også i innboksen din, og den virker for alltid.', d.lenke);
            return;
          }
          var feil = (d && d.error) || '';
          var tekst = LANG === 'en' ? 'Something went wrong. Contact the seller of the course.'
                                    : 'Noe gikk galt. Ta kontakt med den som selger kurset.';
          if (feil === 'bad_email') tekst = LANG === 'en' ? 'That email address does not look right.' : 'Den e-postadressen ser ikke riktig ut.';
          if (feil === 'bad_key') tekst = LANG === 'en'
            ? 'This link is not valid. Use the link you were sent right after paying.'
            : 'Denne lenken gjelder ikke. Bruk lenken du ble sendt til rett etter betalingen.';
          if (feil === 'for_mange') tekst = LANG === 'en'
            ? 'Too many have been given access here today. Contact the seller.'
            : 'For mange har fått tilgang her i dag. Ta kontakt med selgeren.';
          if (feil === 'not_found') tekst = LANG === 'en' ? 'The course was not found.' : 'Fant ikke kurset.';
          vis('feil', tekst);
        })
        .catch(function () {
          vis('feil', LANG === 'en' ? 'Could not reach the server. Try again.' : 'Fikk ikke kontakt med serveren. Prøv igjen.');
        })
        .then(function () { knapp.disabled = false; });
    });

    document.getElementById('epost').addEventListener('keydown', function (e) { if (e.key === 'Enter') knapp.click(); });
    document.getElementById('yr').textContent = new Date().getFullYear();
    switchLanguage(LANG);
  </script>
</body>
</html>
