name = "lme-vipps-payment"
main = "index.js"
compatibility_date = "2025-01-01"

# "test" (apitest.vipps.no) eller "production" (api.vipps.no).
# Bytt til "production" først når ekte Vipps-betalinger skal aktiveres.
[vars]
VIPPS_ENV = "test"

# Hemmeligheter (settes IKKE her, se VIPPS-SETUP.md):
#   npx wrangler secret put VIPPS_CLIENT_ID
#   npx wrangler secret put VIPPS_CLIENT_SECRET
#   npx wrangler secret put VIPPS_SUBSCRIPTION_KEY
#   npx wrangler secret put VIPPS_MERCHANT_SERIAL_NUMBER
