<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>Takk for kjøpet · LME</title>
<link rel="icon" href="/images/lme-logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;600;700;800&display=swap');
  @font-face {
    font-family: 'Sasson Montessori';
    src: url('/fonts/SassoonMontessori.woff2') format('woff2'), url('/fonts/SassoonMontessori.ttf') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root {
    --lime:#A4D233; --lime-soft:#E8F5D1; --cerise:#E91E89; --cerise-soft:#FCE3F1;
    --bg:#FBF7F0; --ink:#1F1B24; --ink-soft:#5A5560; --r-xl:36px; --r-pill:999px;
    --font:'Sasson Montessori','Playpen Sans',system-ui,sans-serif;
    --font-head:'Playpen Sans',system-ui,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family: var(--font); color: var(--ink); background: var(--bg);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 560px; width: 100%; padding: 40px 24px; text-align: center; }
  .brandbar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 26px; }
  .brandbar img { height: 34px; }
  .seal {
    width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--lime), #7fae1f);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 36px rgba(127,174,31,.35); font-size: 40px;
  }
  h1 { font-family: var(--font-head); font-size: clamp(24px,5vw,32px); margin-bottom: 12px; }
  p { color: var(--ink-soft); font-size: 16px; margin-bottom: 10px; }
  .cta {
    display: inline-block; margin-top: 20px; background: var(--cerise); color: #fff;
    font-weight: 700; padding: 14px 26px; border-radius: var(--r-pill);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar"><img src="/images/lme-logo.png" alt="LME"></div>
  <div class="seal">🎉</div>
  <h1 data-no="Tusen takk, du er i gang!" data-en="Thank you, you're in!">Tusen takk, du er i gang!</h1>
  <p data-no="Sjekk innboksen din, kvittering og din personlige kurslenke er på vei." data-en="Check your inbox, your receipt and personal course link are on the way.">Sjekk innboksen din, kvittering og din personlige kurslenke er på vei.</p>
  <p data-no="Spørsmål? Svar på e-posten du nettopp fikk, så hjelper jeg deg." data-en="Questions? Reply to the email you just got, and I'll help you.">Spørsmål? Svar på e-posten du nettopp fikk, så hjelper jeg deg.</p>
  <a href="/academy" class="cta" data-no="Til kurs →" data-en="To classes →">Til kurs →</a>
</div>
<script>
(function () {
  var lang = 'no';
  try { lang = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('lme_lang') || 'no'); } catch (e) {}
  if (lang === 'en') {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-no][data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-en'); });
  }
})();
</script>
</body>
</html>
