<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LME Strikk og Hekle">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6F2"/><stop offset="100%" stop-color="#FBDCE5"/>
    </linearGradient>
    <linearGradient id="lgBall" x1="0.15" y1="0.05" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FF7FB4"/><stop offset="100%" stop-color="#D8137B"/>
    </linearGradient>
    <linearGradient id="lgWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFD6B8"/><stop offset="100%" stop-color="#C29B71"/>
    </linearGradient>
    <clipPath id="lgClip"><circle cx="256" cy="286" r="132"/></clipPath>
  </defs>

  <rect id="lgPlate" width="512" height="512" rx="112" fill="url(#lgBg)"/>

  <!-- pinnene bak noestet -->
  <g stroke-linecap="round">
    <line x1="118" y1="392" x2="392" y2="120" stroke="url(#lgWood)" stroke-width="30"/>
    <circle cx="396" cy="116" r="21" fill="#C29B71"/>
    <line x1="394" y1="392" x2="120" y2="120" stroke="url(#lgWood)" stroke-width="30"/>
    <circle cx="116" cy="116" r="21" fill="#C29B71"/>
  </g>

  <!-- garnnoestet -->
  <circle cx="256" cy="286" r="132" fill="url(#lgBall)"/>
  <g clip-path="url(#lgClip)" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="13">
    <ellipse cx="256" cy="286" rx="132" ry="54" transform="rotate(-34 256 286)"/>
    <ellipse cx="256" cy="286" rx="125" ry="26" transform="rotate(-34 256 286)"/>
    <ellipse cx="256" cy="286" rx="132" ry="47" transform="rotate(40 256 286)"/>
    <ellipse cx="256" cy="286" rx="122" ry="21" transform="rotate(40 256 286)"/>
    <ellipse cx="256" cy="286" rx="129" ry="38" transform="rotate(86 256 286)"/>
  </g>

  <!-- garntraaden som stikker ut -->
  <path d="M374 336 C 406 356, 414 392, 396 420" fill="none" stroke="#E91E89" stroke-width="13" stroke-linecap="round"/>
</svg>
