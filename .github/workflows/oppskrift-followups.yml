name: Oppskrift oppfølgingsmail

# Trigger den daglige køen som sender oppfølgingsmail til oppskrift-kjøpere
# (dag 3 og uke 2). Kjører en gang i døgnet og kan startes manuelt fra Actions.
# Valgfritt: legg repo-hemmeligheten OPPSKRIFT_CRON_TOKEN hvis endepunktet er beskyttet.

on:
  schedule:
    - cron: "15 9 * * *"   # daglig kl. 09:15 UTC
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger oppfølgings-køen
        env:
          TOKEN: ${{ secrets.OPPSKRIFT_CRON_TOKEN }}
        run: |
          curl -fsS "https://lmexplorers.com/api/cron/oppskrift-followups${TOKEN:+?token=$TOKEN}"
