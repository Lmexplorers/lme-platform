name: Utfordringen oppfølgingsmail

# Trigger den daglige køen som sender dag 1/3/7/14/21/30 til kjøpere av
# 10 000-visninger-utfordringen. Kjører en gang i døgnet og kan også
# startes manuelt fra Actions-fanen.
# Valgfritt: legg repo-hemmeligheten UTFORDRING_CRON_TOKEN hvis endepunktet er beskyttet.

on:
  schedule:
    - cron: "0 9 * * *"   # daglig kl. 09:00 UTC
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger oppfølgings-køen
        env:
          TOKEN: ${{ secrets.UTFORDRING_CRON_TOKEN }}
        run: |
          curl -fsS "https://lmexplorers.com/api/cron/utfordring-followups${TOKEN:+?token=$TOKEN}"
