<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hook Generator | LME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Sasson Montessori';
      src: url('/fonts/SassoonMontessori.woff2') format('woff2'),
           url('/fonts/SassoonMontessori.ttf') format('truetype');
      font-weight: normal; font-style: normal; font-display: swap;
    }

    :root {
      --pink-50:  #fff5f8;
      --pink-100: #ffe8f0;
      --pink-200: #ffd1e1;
      --pink-300: #ffb3cd;
      --pink-400: #ff8ab3;
      --pink-500: #e85a92;
      --pink-600: #c43d75;
      --pink-700: #8f2a55;
      --purple-light: #efe4f7;
      --purple: #b07fd4;
      --warm-white: #fffcf9;
      --ink: #3d2438;
      --ink-soft: #6b4760;
      --line: rgba(61, 36, 56, 0.1);
      --font-head: 'Playpen Sans', system-ui, sans-serif;
      --font-body: 'Sasson Montessori', 'Playpen Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: linear-gradient(160deg, var(--pink-200) 0%, var(--pink-400) 100%);
      min-height: 100vh;
      line-height: 1.6;
    }

    h1, h2, h3, h4 { font-family: var(--font-head); }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 20px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .bar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--pink-600);
      font-size: 15px;
      text-decoration: none;
    }

    .bar .brand img { width: 32px; height: 32px; }

    .bar .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 9px 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      font-size: 13.5px;
      white-space: nowrap;
    }

    .btn-back { background: #fff; color: var(--ink); border: 1px solid #eedce2; }
    .btn-lang { background: #FCEFF2; color: #C13D6A; }
    .btn-primary { background: var(--pink-600); color: #fff; font-size: 15px; padding: 12px 24px; }
    .btn-primary:hover { background: var(--pink-700); }

    .wrap {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .head {
      text-align: center;
      margin-bottom: 40px;
    }

    .head h1 {
      font-size: 32px;
      margin: 12px 0 8px;
      color: var(--ink);
    }

    .head p {
      color: var(--ink-soft);
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 15px;
    }

    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--pink-200);
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 15px;
      background: #fff;
      color: var(--ink);
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--pink-600);
      box-shadow: 0 0 0 3px var(--pink-100);
    }

    .options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .option-btn {
      padding: 10px 16px;
      border: 2px solid var(--pink-200);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    .option-btn.active {
      background: var(--pink-600);
      color: #fff;
      border-color: var(--pink-600);
    }

    .option-btn:hover {
      border-color: var(--pink-600);
    }

    .generator-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--pink-600), var(--purple));
      color: #fff;
      border: 0;
      border-radius: 12px;
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .generator-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(196, 61, 117, 0.3);
    }

    .generator-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results {
      background: var(--purple-light);
      border: 2px solid var(--purple);
      border-radius: 16px;
      padding: 24px;
      margin-top: 40px;
      display: none;
    }

    .results.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .results h2 {
      color: var(--pink-600);
      margin-bottom: 16px;
      font-size: 20px;
    }

    .hook-item {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      border-left: 4px solid var(--pink-600);
    }

    .hook-item p {
      color: var(--ink);
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .hook-item .copy-btn {
      background: var(--pink-100);
      color: var(--pink-600);
      border: 0;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }

    .hook-item .copy-btn:hover {
      background: var(--pink-200);
    }

    .hook-item .copy-btn.copied {
      background: var(--pink-300);
      color: #fff;
    }

    .error {
      background: #ffe8e8;
      color: #c43d75;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-size: 14px;
    }

    .error.show {
      display: block;
    }

    @media (max-width: 520px) {
      .wrap { padding: 30px 16px; }
      .head h1 { font-size: 26px; }
      .options { gap: 8px; }
      .option-btn { padding: 8px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a class="brand" href="/dashboard"><img src="/images/lme-logo.png" alt="LME">LME</a>
    <div class="actions">
      <button class="btn btn-lang" id="lme-lang" type="button">🇬🇧 English</button>
      <a class="btn btn-back" href="/mia-og-teo" data-no="‹ Tilbake" data-en="‹ Back">‹ Tilbake</a>
    </div>
  </div>

  <div class="wrap">
    <div class="head">
      <h1 data-no="Hook Generator" data-en="Hook Generator">Hook Generator</h1>
      <p data-no="Lag Instagram hooks som fanger oppmerksomheten basert på babyens rutine" data-en="Generate Instagram hooks that grab attention based on your baby's routine">Lag Instagram hooks som fanger oppmerksomheten basert på babyens rutine</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="hookForm">
      <div class="form-group">
        <label for="babyName" data-no="Babyens navn (valgfritt)" data-en="Baby's name (optional)">Babyens navn (valgfritt)</label>
        <input type="text" id="babyName" placeholder="" data-no-placeholder="f.eks. Ellie" data-en-placeholder="e.g. Ellie">
      </div>

      <div class="form-group">
        <label for="topic" data-no="Hva er ditt favorittema?" data-en="What is your favorite topic?">Hva er ditt favorittema?</label>
        <input type="text" id="topic" required placeholder="" data-no-placeholder="f.eks. Montessori, barnehage, hjemmeskole" data-en-placeholder="e.g. Montessori, daycare, homeschool">
      </div>

      <div class="form-group">
        <label for="age" data-no="Hvor gammel er babyen?" data-en="How old is the baby?">Hvor gammel er babyen?</label>
        <input type="number" id="age" min="0" max="60" required>
      </div>

      <div class="form-group">
        <label data-no="Babyens favorittfarger" data-en="Baby's favorite colors">Babyens favorittfarger</label>
        <input type="text" id="colors" placeholder="" data-no-placeholder="f.eks. rosa, gul, grønt" data-en-placeholder="e.g. pink, yellow, green">
      </div>

      <div class="form-group">
        <label data-no="Hvordan føler du deg nå?" data-en="How are you feeling?">Hvordan føler du deg nå?</label>
        <div class="options">
          <button type="button" class="option-btn" data-value="Breast" data-no-label="Amming" data-en-label="Breastfeeding">Amming</button>
          <button type="button" class="option-btn" data-value="Bottle" data-no-label="Flaske" data-en-label="Bottle">Flaske</button>
          <button type="button" class="option-btn" data-value="Both" data-no-label="Begge" data-en-label="Both">Begge</button>
        </div>
        <input type="hidden" id="feeling" required>
      </div>

      <div class="form-group">
        <label for="wakeTime" data-no="Når våkner babyen vanligvis?" data-en="What time does baby usually wake?">Når våkner babyen vanligvis?</label>
        <input type="time" id="wakeTime" required>
      </div>

      <div class="form-group">
        <label for="naps" data-no="Hvor mange blundringer per dag?" data-en="How many naps per day?">Hvor mange blundringer per dag?</label>
        <input type="number" id="naps" min="0" max="10" required value="2">
      </div>

      <button type="submit" class="generator-btn" data-no="Generer hooks" data-en="Generate hooks">Generer hooks</button>
    </form>

    <div class="results" id="results">
      <h2 data-no="Dine Instagram hooks:" data-en="Your Instagram hooks:">Dine Instagram hooks:</h2>
      <div id="hooksList"></div>
    </div>
  </div>

  <script>
    (function () {
      // Language system
      window.LME_CURRENT_LANG = 'no';
      try { window.LME_CURRENT_LANG = localStorage.getItem('lme_lang') === 'en' ? 'en' : 'no'; } catch (e) {}

      function applyLanguage() {
        var en = window.LME_CURRENT_LANG === 'en';
        document.documentElement.lang = en ? 'en' : 'no';
        document.querySelectorAll('[data-no][data-en]').forEach(function (el) {
          if (el.hasAttribute('data-no-placeholder')) {
            el.placeholder = en ? el.getAttribute('data-en-placeholder') : el.getAttribute('data-no-placeholder');
          } else {
            el.textContent = en ? el.getAttribute('data-en') : el.getAttribute('data-no');
          }
        });
        document.querySelectorAll('[data-no-label][data-en-label]').forEach(function (el) {
          el.textContent = en ? el.getAttribute('data-en-label') : el.getAttribute('data-no-label');
        });
        var b = document.getElementById('lme-lang');
        if (b) b.textContent = en ? '🇳🇴 Norsk' : '🇬🇧 English';
      }

      window.lmeToggleLang = function () {
        window.LME_CURRENT_LANG = window.LME_CURRENT_LANG === 'en' ? 'no' : 'en';
        try { localStorage.setItem('lme_lang', window.LME_CURRENT_LANG); } catch (e) {}
        applyLanguage();
      };

      document.getElementById('lme-lang').addEventListener('click', window.lmeToggleLang);
      applyLanguage();

      // Option buttons for feeling
      var optionBtns = document.querySelectorAll('.option-btn');
      optionBtns.forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          optionBtns.forEach(function (b) { b.classList.remove('active'); });
          this.classList.add('active');
          document.getElementById('feeling').value = this.getAttribute('data-value');
        });
      });

      // Hook generation
      var hookPrompts = [
        "{name}{age}개월 아기의 일과를 봐. {topic} 최고의 방법이라 생각하니? {colors} 색깔을 좋아해.",
        "내 남편이 {name}을 보면서 낯선 사람 같다고 했어. {topic} 이렇게 효과 있을 리가...",
        "부부 관계를 죽인 것 같아. 아이 낳고 25년이 지나도록 눈도 안 마주쳤어.",
        "{name}는 {age}개월이고 {feeling}를 먹이고 있어. {topic}에서는 뭘 권할까?",
        "{topic}를 따르는데 {colors} 색 물건들로 정렬했더니 {name}이 훨씬 집중 잘해.",
        "하루 {naps}번 자는데 {name} 일과가 이렇게 변했어. {topic}는 진짜 먹히네."
      ];

      document.getElementById('hookForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var babyName = document.getElementById('babyName').value || (window.LME_CURRENT_LANG === 'en' ? 'baby' : 'babyen');
        var topic = document.getElementById('topic').value;
        var age = document.getElementById('age').value;
        var colors = document.getElementById('colors').value || (window.LME_CURRENT_LANG === 'en' ? 'colors' : 'farger');
        var feeling = document.getElementById('feeling').value;
        var wakeTime = document.getElementById('wakeTime').value;
        var naps = document.getElementById('naps').value;

        if (!topic || !age || !feeling) {
          showError(window.LME_CURRENT_LANG === 'en' ? 'Please fill in required fields' : 'Fyll inn obligatoriske felt');
          return;
        }

        var hooks = generateHooks(babyName, topic, age, colors, feeling, naps);
        displayHooks(hooks);
      });

      function generateHooks(name, topic, age, colors, feeling, naps) {
        var hooks = [];
        var templates = [
          `Jeg trodde mitt barnehage-hverdag så helt annerledes ut. Her er hva som endret det hele med ${topic}.`,
          `${name} er ${age} måneder og det første vi gjør hver morgen er å bruke ${topic}. Resultatet? ${name} fokuserer bedre hele dagen.`,
          `Når jeg bruker ${topic}-metoden med ${name}, ser jeg at ${colors} gjenstander fanger oppmerksomheten ${name}'s først.`,
          `${feeling}-måten har virkelig hjulpet oss. I kombinasjon med ${topic} har ${name} blitt så mye roligere.`,
          `Det tok ${age} måneder før jeg forsto: ${topic} fungerer best når miljøet er praktisk og ryddig. ${name} ville ikke være stille før det var likt.`,
          `Hvert dag klokka ${document.getElementById('wakeTime').value} våkner ${name} opp. Og det første vi gjør? Vi setter i gang en ${topic}-aktivitet.`,
          `${naps} blundringer om dagen betyr at jeg har 3 timer til å arbeide med ${topic}. Det har endret alt for oss.`,
          `Hvis du bruker ${topic} på riktig måte, kombinert med ${feeling}, oppnår du en rytme som faktisk fungerer.`
        ];

        for (var i = 0; i < Math.min(templates.length, 4); i++) {
          hooks.push(templates[i]);
        }

        return hooks;
      }

      function displayHooks(hooks) {
        var hooksList = document.getElementById('hooksList');
        hooksList.innerHTML = '';
        hooks.forEach(function (hook, idx) {
          var div = document.createElement('div');
          div.className = 'hook-item';
          div.innerHTML = `
            <p>${escapeHtml(hook)}</p>
            <button type="button" class="copy-btn" data-no="Kopier" data-en="Copy" onclick="copyToClipboard(this, '${escapeHtml(hook).replace(/'/g, "\\'")}')">Kopier</button>
          `;
          hooksList.appendChild(div);
        });

        document.getElementById('results').classList.add('show');
        applyLanguage();
      }

      window.copyToClipboard = function (btn, text) {
        var actualText = text.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
        navigator.clipboard.writeText(actualText).then(function () {
          btn.classList.add('copied');
          btn.textContent = window.LME_CURRENT_LANG === 'en' ? 'Copied!' : 'Kopiert!';
          setTimeout(function () {
            btn.classList.remove('copied');
            btn.textContent = window.LME_CURRENT_LANG === 'en' ? 'Copy' : 'Kopier';
          }, 2000);
        });
      };

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function showError(msg) {
        var errorEl = document.getElementById('errorMsg');
        errorEl.textContent = msg;
        errorEl.classList.add('show');
        setTimeout(function () { errorEl.classList.remove('show'); }, 4000);
      }
    })();
  </script>
  <script src="/js/lme-account.js?v=11" defer></script>
</body>
</html>
